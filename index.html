<!DOCTYPE html>

<html>

    <head>
        <title>AECD FLE FC</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="AECD.css">
    </head>

    <body class="accueil">

        <div class="container">
            <h1 class="titre">Plateforme de support aux enseignants</h1>
            <h2 class="welcome">Bienvenus! Bem-vindos! Welcome! Bienvenidos!</h2>
            <p id="api-status" role="status">Vérification de l'API...</p>
            
            <section class="langues"> 
                <button>
                    <a href="Page1FLE.html">FLE</a>
                </button>
                <button>
                    <a href="Page1FC.html">FC</a>
                </button>
            </section>
    
        </div>

        <script>
            fetch('http://localhost:3000/health')
                .then(response => {
                    if (!response.ok) throw new Error('API unavailable')
                    return response.json()
                })
                .then(() => {
                    document.getElementById('api-status').textContent = 'API connectée'
                })
                .catch(() => {
                    document.getElementById('api-status').textContent = 'API indisponible'
                })
        </script>

    </body>
    
</html>
